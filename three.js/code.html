<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_9 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_9" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_9');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0.5, 3);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Studio Lighting
const ambientLight = new THREE.AmbientLight(0x404040, 2);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0x8b5cf6, 3); // Electric Violet
mainLight.position.set(2, 5, 5);
scene.add(mainLight);

const rimLight = new THREE.DirectionalLight(0x22d3ee, 2); // Cyan
rimLight.position.set(-5, 2, -2);
scene.add(rimLight);

// 3D Hand Silhouette (Stylized)
const handGroup = new THREE.Group();

const palmGeometry = new THREE.BoxGeometry(0.8, 1, 0.2);
const palmMaterial = new THREE.MeshPhongMaterial({ color: 0x3b3742, shininess: 100 });
const palm = new THREE.Mesh(palmGeometry, palmMaterial);
handGroup.add(palm);

const fingerGeom = new THREE.CylinderGeometry(0.08, 0.08, 0.8, 16);
const fingerMat = new THREE.MeshPhongMaterial({ color: 0x8b5cf6 });

const fingerOffsets = [-0.3, -0.1, 0.1, 0.3];
fingerOffsets.forEach((x, i) => {
  const finger = new THREE.Mesh(fingerGeom, fingerMat);
  finger.position.set(x, 0.9, 0);
  finger.rotation.z = (Math.random() - 0.5) * 0.1;
  handGroup.add(finger);
});

const thumb = new THREE.Mesh(fingerGeom, fingerMat);
thumb.position.set(0.5, 0.2, 0);
thumb.rotation.z = -Math.PI / 3;
handGroup.add(thumb);

scene.add(handGroup);

// Landmark Points (Glow effect)
const pointGeom = new THREE.SphereGeometry(0.04, 8, 8);
const pointMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee });
for(let i=0; i<15; i++) {
    const p = new THREE.Mesh(pointGeom, pointMat);
    p.position.set((Math.random()-0.5)*1.2, (Math.random()-0.5)*1.5, 0.15);
    handGroup.add(p);
}

function animate() {
  requestAnimationFrame(animate);
  handGroup.rotation.y += 0.01;
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_9 -->
</body>
</html>
