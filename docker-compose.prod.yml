version: "3.8"

# ================================================================
# Production Docker Compose
# Use with: docker-compose -f docker-compose.prod.yml up -d
# ================================================================

services:

  # ──────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sign_language_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # ──────────────────────────────────────────
  # FastAPI Backend
  # ──────────────────────────────────────────
  backend:
    image: ${ECR_REGISTRY}/sign-language-backend:${IMAGE_TAG:-latest}
    container_name: sign_language_backend_prod
    restart: always
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      MODEL_PATH: ${MODEL_PATH:-models/}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - certificates_data:/app/certificates
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend-net
      - frontend-net

  # ──────────────────────────────────────────
  # React Frontend (Nginx)
  # ──────────────────────────────────────────
  frontend:
    image: ${ECR_REGISTRY}/sign-language-frontend:${IMAGE_TAG:-latest}
    container_name: sign_language_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend-net

  # ──────────────────────────────────────────
  # Nginx Reverse Proxy (SSL Termination)
  # ──────────────────────────────────────────
  nginx-proxy:
    image: nginx:alpine
    container_name: sign_language_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - ./deploy/nginx/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-net
    profiles:
      - ssl

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  certificates_data:
    driver: local

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge
