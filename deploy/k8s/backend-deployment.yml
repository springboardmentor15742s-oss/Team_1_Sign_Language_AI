apiVersion: apps/v1
kind: Deployment
metadata:
  name: sign-language-backend
  namespace: sign-language
  labels:
    app: sign-language-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sign-language-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sign-language-backend
        tier: backend
    spec:
      containers:
        - name: backend
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/sign-language-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ALGORITHM
              value: "HS256"
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "1440"
            - name: MODEL_PATH
              value: "models/"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sign-language-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sign-language-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: certificates
              mountPath: /app/certificates
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: certificates
          persistentVolumeClaim:
            claimName: certificates-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: sign-language-backend-svc
  namespace: sign-language
spec:
  selector:
    app: sign-language-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sign-language-backend-hpa
  namespace: sign-language
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sign-language-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
