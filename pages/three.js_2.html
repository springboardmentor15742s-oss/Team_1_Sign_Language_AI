<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_19 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_19" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_19');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-ANIMATION_19');
  
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  camera.position.set(0, 0, 5);

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const mainLight = new THREE.PointLight(0x8b5cf6, 2); // Electric Violet
  mainLight.position.set(5, 5, 5);
  scene.add(mainLight);

  const secondaryLight = new THREE.PointLight(0x22d3ee, 1.5); // Cyan
  secondaryLight.position.set(-5, -5, 2);
  scene.add(secondaryLight);

  // Hand Group
  const handGroup = new THREE.Group();
  scene.add(handGroup);

  // Materials
  const skinMat = new THREE.MeshPhongMaterial({ 
    color: 0x1d1a23, 
    transparent: true, 
    opacity: 0.8,
    shininess: 80 
  });
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee });

  // Palm
  const palm = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.3), skinMat);
  handGroup.add(palm);

  // Create Fingers
  const fingerGeom = new THREE.CylinderGeometry(0.1, 0.1, 1.2, 16);
  const fingers = [];

  const fingerConfigs = [
    { name: 'index', x: -0.45, y: 0.7, z: 0, length: 1.2 },
    { name: 'middle', x: -0.15, y: 0.8, z: 0, length: 1.3 },
    { name: 'ring', x: 0.15, y: 0.75, z: 0, length: 1.2 },
    { name: 'pinky', x: 0.45, y: 0.6, z: 0, length: 1.0 },
    { name: 'thumb', x: 0.7, y: -0.2, z: 0.1, length: 0.9, rotZ: -Math.PI / 3 }
  ];

  fingerConfigs.forEach(config => {
    const finger = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, config.length, 16), skinMat);
    finger.position.set(config.x, config.y + config.length/2, config.z);
    if (config.rotZ) finger.rotation.z = config.rotZ;
    
    // Joint landmarks
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), glowMat);
    tip.position.set(0, config.length/2, 0);
    finger.add(tip);

    handGroup.add(finger);
    fingers.push({ mesh: finger, config });
  });

  // Animation logic for "Gestures"
  let gestureTime = 0;
  function animate() {
    requestAnimationFrame(animate);
    gestureTime += 0.02;

    // Ambient floating
    handGroup.rotation.y = Math.sin(gestureTime * 0.5) * 0.1;
    handGroup.position.y = Math.sin(gestureTime * 0.8) * 0.1;

    // "L" Shape Transition (Index up, thumb out, others down)
    const morph = (Math.sin(gestureTime) + 1) / 2; // 0 to 1

    fingers.forEach(f => {
      if (f.config.name === 'index') {
        f.mesh.rotation.x = -morph * 0.2; // Stay up
      } else if (f.config.name === 'thumb') {
        f.mesh.rotation.z = -Math.PI/3 - (morph * 0.4); // Stretch out
      } else {
        f.mesh.rotation.x = morph * 1.5; // Fold down
        f.mesh.position.y = f.config.y + f.config.length/2 - (morph * 0.4);
      }
    });

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  animate();
})();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_19 -->
</body>
</html>
